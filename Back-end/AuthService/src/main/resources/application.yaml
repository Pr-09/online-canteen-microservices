spring:
  application:
    name: Auth-Service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/canteen_db_new?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET:OnlineCanteenJwtSecretKey2026MustBeAtLeast32BytesLong}

server:
  port: ${PORT:8083}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}