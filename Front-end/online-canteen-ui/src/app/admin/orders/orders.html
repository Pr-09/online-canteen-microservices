<app-admin-navbar></app-admin-navbar>

<div class="container">
  <h1>Manage Orders</h1>

  @for (order of orders; track order.id) {
    <div class="order-card">
      <div>
        <h2>Order #{{ order.id }}</h2>

        <p>
          Table:
          {{ order.tableNumber }}
        </p>

        <p>₹{{ order.totalAmount }}</p>

        <p>
          Status:
          {{ order.status }}
        </p>
      </div>

      <div class="actions">
        <button (click)="updateStatus(order.id, 'ACCEPTED')">Accept</button>

        <button (click)="updateStatus(order.id, 'PREPARING')">Preparing</button>

        <button (click)="updateStatus(order.id, 'READY')">Ready</button>

        <button (click)="updateStatus(order.id, 'DELIVERED')">Delivered</button>
      </div>
    </div>
  }
</div>
